<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request an Audition — Worship Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CONFIG NOTE: search this file for "EDIT ME" to customize.
   The one you MUST change before going live is BACKEND_URL
   near the bottom of the <script> section.
   ============================================================ */

:root{
  --ink:#1C3A4C;
  --ink-deep:#10242E;
  --paper:#FBF6ED;
  --paper-dim:#F1E9DA;
  --amber:#FDC70D;
  --amber-deep:#CFA30B;
  --teal:#24506B;
  --text:#22303A;
  --muted:#5B6B74;
  --danger:#B0453A;
  --line:#E4DBC9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(227,168,87,0.18), transparent 60%),
    var(--ink);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:48px 16px 80px;
}
h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
.wrap{width:100%;max-width:640px;}
.masthead{text-align:center;color:var(--paper);margin-bottom:28px;}
.logo-badge{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,0.4);border:3px solid rgba(255,255,255,0.92);}
.logo-badge img{width:100%;height:100%;object-fit:cover;display:block;}
.masthead .kicker{color:var(--amber);font-size:14.5px;margin-bottom:8px;font-weight:500;font-style:italic;font-family:'Fraunces',serif;}
.masthead h1{font-size:34px;line-height:1.15;font-weight:500;color:var(--paper);}
.masthead p{color:#C9D8E0;margin-top:10px;font-size:15px;line-height:1.5;}

.wave{display:flex;justify-content:center;gap:3px;margin:20px 0 0;height:20px;align-items:center;}
.wave span{width:3px;background:var(--amber);border-radius:2px;opacity:0.85;}

.card{
  background:var(--paper);
  border-radius:14px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  overflow:hidden;
}
.progress-track{height:4px;background:var(--paper-dim);position:relative;}
.progress-fill{height:100%;background:var(--amber);transition:width .3s ease;}
.progress-label{display:flex;justify-content:space-between;align-items:center;padding:16px 28px 0;font-size:13px;color:var(--muted);}

.step{padding:12px 28px 32px;}
.step h2{font-size:22px;font-weight:500;margin-bottom:6px;}
.step .sub{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.5;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4;}
input[type=text],input[type=email],input[type=tel],input[type=number],textarea,select{
  width:100%;
  border:1.5px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:11px 13px;
  font-family:inherit;
  font-size:14.5px;
  color:var(--text);
}
textarea{resize:vertical;min-height:90px;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}

.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:420px){.check-grid{grid-template-columns:1fr;}}
.check-item{
  display:flex;align-items:center;gap:9px;
  border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;
  cursor:pointer;font-size:14px;background:#fff;
}
.check-item input{width:16px;height:16px;flex:none;}
.check-item.checked{border-color:var(--amber);background:#FCF3E4;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:480px){.row2{grid-template-columns:1fr;}}

.upload-box{
  border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;
  background:#fff;cursor:pointer;
}
.upload-box.dragover{border-color:var(--amber);background:#FCF3E4;}
.upload-box .fname{margin-top:10px;font-size:13.5px;color:var(--teal);font-weight:600;word-break:break-all;}
.or-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12.5px;}
.or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--line);}

.slot-date-group{margin-bottom:16px;}
.slot-date-group h3{font-size:14.5px;font-weight:600;margin-bottom:8px;color:var(--text);}
.slot-list{display:flex;flex-wrap:wrap;gap:8px;}
.slot-btn{
  border:1.5px solid var(--line);background:#fff;border-radius:8px;
  padding:9px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;
}
.slot-btn.selected{background:var(--teal);border-color:var(--teal);color:#fff;}
.slot-empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center;}

.read-box{max-height:210px;overflow-y:auto;border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;background:#fff;font-size:13.5px;line-height:1.65;color:var(--text);}
.read-box h4{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:0.01em;}
.read-box p{margin:0 0 10px;}
.read-box ul{margin:0 0 10px 18px;padding:0;}
.read-box li{margin-bottom:5px;}

.summary-block{border:1.5px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;background:#fff;}
.summary-block h4{font-size:12.5px;text-transform:none;color:var(--muted);margin:0 0 6px;font-weight:600;}
.summary-block p{margin:0;font-size:14.5px;line-height:1.6;}

.actions{display:flex;justify-content:space-between;align-items:center;padding-top:8px;}
.btn{
  font-family:inherit;font-size:14.5px;font-weight:600;
  padding:11px 22px;border-radius:8px;border:none;cursor:pointer;
}
.btn-primary{background:var(--amber);color:#2A1B08;}
.btn-primary:hover{background:var(--amber-deep);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--text);}

.error-text{color:var(--danger);font-size:13px;margin-top:6px;}
.agree-row{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:14px;background:#fff;}
.agree-row input{margin-top:3px;}

.confirm{text-align:center;padding:44px 28px;}
.confirm .icon{font-size:40px;margin-bottom:12px;}
.confirm h2{font-size:24px;margin-bottom:10px;}
.confirm p{color:var(--muted);font-size:15px;line-height:1.6;}
.confirm .slot-echo{margin-top:18px;background:var(--paper-dim);border-radius:8px;padding:14px 18px;font-size:15px;font-weight:600;color:var(--teal);}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,0.15);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:-2px;}
@keyframes spin{to{transform:rotate(360deg);}}

.footer-note{text-align:center;color:#8B81A0;font-size:12.5px;margin-top:22px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="logo-badge"><img id="logoImg" alt="Wills Valley Community Church logo"></div>
    <div class="kicker" id="churchKicker">"Changed Lives, Changing Lives"</div>
    <h1>Request an Audition for the Worship Team</h1>
    <p>Tell us about yourself, share a recording, and pick a time to audition in person.</p>
  </div>
  <div class="wave" id="wave"></div>

  <div class="card">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label">
      <span id="stepLabel">Step 1 of 7</span>
      <span id="stepName">Basic info</span>
    </div>
    <div class="step" id="stepContainer"></div>
  </div>

  <p class="footer-note">Questions about your application? Contact <span id="contactEmail">worship@gracecommunity.org</span></p>
</div>

  CHURCH_NAME: "Wills Valley Community Church",
  CONTACT_EMAIL: "kshrad@yahoo.com",

  ROLES: [
    "Vocalist", "Acoustic Guitar",
    "Electric Guitar", "Bass Guitar", "Drums", "Keys / Piano", "Sound / Tech"
  ],

  AGREEMENT_TEXT: "I affirm my personal faith in Jesus Christ and my desire to serve God through music. I understand that serving on the worship team involves regular rehearsal commitments and a posture of humility and teamwork, and I agree to uphold the values of our church community.",

  // Max upload size before we ask the applicant to paste a link instead.
  // Kept modest because the file travels as base64 text to the backend.

  // Required reading shown on the very first screen. Applicants must
  // check a box confirming they've read both before they can continue.
  // Edit the wording freely — lines in ALL CAPS become bold headings,
  // and lines starting with "*" become bullet points.
  INFO_TEXT: `WILLS VALLEY WORSHIP TEAM INFORMATION:
Being a part of Wills Valley's Worship Team is a big commitment to the Church and to the team. There will be a time commitment to practicing with the team (times set by leader), commitment to practicing your vocal part(s) and/or instrument(s) throughout the week, commitment to nurture and develop your gifts continually, commitment to being punctual on Sunday mornings for practice, commitment to being a part of the community of our Church, and possibly other commitments specified by the worship leader. Please take some time to pray if this ministry is where God is leading you to serve. If there is any reason that you will not be able to make these commitments to the worship team, then please consider applying later on in the future when you are able to make a commitment. You must be a member of Wills Valley Community Church to be considered.
Being a part of the team requires character. The fruit of the Spirit should be evident in your life. We are leading people to worship Jesus so your life must be lived in a manner worthy of the Gospel and this calling. None of us are perfect, but real, authentic fruit should be growing. The dedication that is required to represent the church on a platform can be stressful at times, so everyone must be able to communicate effectively, humbly, and in a considerate manner. It is expected that you lay your pride down at the door. Team members do not request solos or songs-they submit songs to the leader as suggestions, which the leader then decides which songs to bring to the team. The leader also determines who will be best suited for solos and leading each song based on the good of the team as a whole and not preferences of individual members. Our goal is to bring glory to God through undistracted worship, not appease egos.
This application has been prayed over and thought through for the church's and the team's benefit. It is a way to find out more about you and your musical gifts, to give you an understanding of the expectations and commitments that you will be making, and to help us determine if you will be a good fit for the Wills Valley Worship Team. Please complete the following application and submit it. Completion of this application does not guarantee a position on the worship team. At the end of this application, you will be able to select an audition time with Kim (don't worry, it isn't as stressful as you may think!). This way Kim can evaluate your musical gifting, and further expound the vision, mission, and desire of the team. The leadership (and at times, along with pastoral input) will decide your acceptance onto the team. After acceptance, if for any reason the leadership feels you are not meeting the requirements set forth for the team, you may be asked to step down for a season or permanently. Our aim is to not sacrifice authentic Christ-centered living for musical talent. Our mission is to bring glory to God by knowing Him and making Him known to others.
*Vocals must be able to sing at least one harmony part in addition to holding down a part while someone else is singing lead.
*You must be at least 16 years old to request an audition/interview. If you are still in high school, please see Kim to discuss expectations.
*You must be a member of Wills Valley Community Church to be considered.`,

  EXPECTATIONS_TEXT: `WILLS VALLEY'S WORSHIP TEAM MEMBER EXPECTATIONS:
* Team members are to be growing in their love and trust in Jesus Christ, as well as their understanding of what it means to be a Christian.
* Team members are to set an example to others in public and private.
* Team members are to be punctual and ready to all worship ministry activities, including practice and corporate worship.
* Team members are to honor, listen to, and support the leader during practice.
* Team members are to receive correction and/or direction with a humble heart.
* Team members are to give Kim Hardinger as much notice as possible whenever they are unable to serve.
* Team members are to practice on their own and seek to grow in their gifts.
* Team members are committed to resolving conflict in a Biblical manner.
* Team members are to communicate concerns to Kim Hardinger in love without slander or pride and will not spread their concerns as an act of gossip.
* Team members are to dress appropriately and will not wear anything that might potentially distract others from worshipping.`

const state = {
  step: 1,
  totalSteps: 8,
  data: {
    readAck:false,
    name:"", email:"", phone:"", age:"", membershipStatus:"", smallGroup:"",
    roles:[], experience:"", instruments:"", training:"",
    faithAnswer:"", whyJoin:"", previousChurch:"", availability:"", conflicts:"",
    refName:"", refContact:"", agree:false,
    mediaMode:"file", mediaFile:null, mediaFileBase64:null, mediaFileName:"", mediaFileType:"", mediaLink:"",
    slot:null
  },
  slots:[],
  submitting:false,
  submitted:false,
  bookingResult:null
};

const stepNames = ["Before you begin","Basic info","About your music","A few questions","Share a recording","Reference & agreement","Request an audition day and time","Review & submit"];

/* ==========================================================
   3. BACKEND CALLS
   ========================================================== */
async function fetchSlots(){
  if (CONFIG.BACKEND_URL.startsWith("PASTE_")) {
    // Demo mode — mirrors the real backend's default rule (every Wednesday, 5:00 PM)
    // so the flow is testable before your Google Sheet backend is connected.
    const fmt = d => d.toISOString().slice(0,10);
    const d = new Date(); d.setHours(0,0,0,0);
    while (d.getDay() !== 3) d.setDate(d.getDate()+1); // next Wednesday
    const slots = [];
    for (let i=0;i<6;i++){
      slots.push({ id:"demo-"+i, date: fmt(d), time:"5:00 PM" });
      d.setDate(d.getDate()+7);
    }
    return slots;
  }
  const res = await fetch(CONFIG.BACKEND_URL + "?action=slots");
  const json = await res.json();
  if (!json.success) throw new Error(json.error || "Could not load audition times.");
  return json.slots;
}

async function submitApplication(payload){
  if (CONFIG.BACKEND_URL.startsWith("PASTE_")) {
    await new Promise(r=>setTimeout(r,900));
    return {success:true, slot: payload.slot};
  }
  const res = await fetch(CONFIG.BACKEND_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"}, // avoids CORS preflight on Apps Script
    body: JSON.stringify(payload)
  });
  return await res.json();
}

/* ==========================================================
   4. VALIDATION
   ========================================================== */
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function isValidPhone(v){ return /^[0-9()+\-.\s]{7,}$/.test(v); }

function validateStep(n){
  const d = state.data, errs = {};
  if (n===1){
    if (!d.readAck) errs.readAck = "Please confirm you've read both documents above to continue.";
  }
  if (n===2){
    if (!d.name.trim()) errs.name = "Please enter your full name.";
    if (!isValidEmail(d.email)) errs.email = "Please enter a valid email.";
    if (!isValidPhone(d.phone)) errs.phone = "Please enter a valid phone number.";
    if (!d.age) errs.age = "Please enter your age.";
    if (!d.smallGroup.trim()) errs.smallGroup = "Please answer this question.";
  }
  if (n===3){
    if (d.roles.length===0) errs.roles = "Select at least one role.";
    if (!d.experience.trim()) errs.experience = "Tell us a bit about your experience.";
  }
  if (n===4){
    if (!d.faithAnswer.trim()) errs.faithAnswer = "This field is required.";
    if (!d.whyJoin.trim()) errs.whyJoin = "This field is required.";
    if (!d.previousChurch.trim()) errs.previousChurch = "Please answer this question.";
  }
  if (n===5){
    if (d.mediaMode==="file" && !d.mediaFile) errs.media = "Please upload a file, or switch to pasting a link.";
    if (d.mediaMode==="link" && !d.mediaLink.trim()) errs.media = "Please paste a link to your recording.";
  }
  if (n===6){
    if (!d.refName.trim()) errs.refName = "Please provide a reference name.";
    if (!d.refContact.trim()) errs.refContact = "Please provide a way to reach them.";
    if (!d.agree) errs.agree = "Please confirm the statement above to continue.";
  }
  if (n===7){
    if (!d.slot) errs.slot = "Please select an audition time.";
  }
  return errs;
}

const container = document.getElementById("stepContainer");

function render(){
  document.getElementById("stepLabel").textContent = state.submitted ? "Done" : `Step ${state.step} of ${state.totalSteps}`;
  document.getElementById("stepName").textContent = state.submitted ? "" : stepNames[state.step-1];
  document.getElementById("progressFill").style.width = state.submitted ? "100%" : `${(state.step-1)/state.totalSteps*100}%`;

  if (state.submitted){ renderConfirmation(); return; }

  const renderers = {1:renderAcknowledge,2:renderBasicInfo,3:renderMusic,4:renderQuestions,5:renderMedia,6:renderReference,7:renderSchedule,8:renderReview};
  renderers[state.step]();
}

function field(label, inputHtml, hint, errKey, errs){
  return `<div class="field">
    <label>${label}</label>
    ${inputHtml}
    ${errs[errKey] ? `<div class="error-text">${errs[errKey]}</div>` : (hint?`<div class="hint">${hint}</div>`:"")}
  </div>`;
}

      </div>
      <input type="file" id="fileInput" accept="audio/*" style="display:none">
    </div>

    <div id="mediaLinkZone" style="display:${d.mediaMode==='link'?'block':'none'}">
      ${field("Link to your recording", `<input type="text" id="f_link" placeholder="YouTube, Google Drive, Dropbox..." value="${escAttr(d.mediaLink)}">`, "Make sure the sharing setting allows anyone with the link to view it. This is the required option for video.", "", errs)}
    </div>
    ${errs.media?`<div class="error-text">${errs.media}</div>`:""}
    ${navButtons(true)}
  `;
  document.getElementById("modeFileBtn").onclick = ()=>{ d.mediaMode="file"; render(); };
  document.getElementById("modeLinkBtn").onclick = ()=>{ d.mediaMode="link"; render(); };

  if (d.mediaMode==="file"){
    const box = document.getElementById("uploadBox");
    const input = document.getElementById("fileInput");
    box.onclick = ()=> input.click();
    input.onchange = handleFile;
    ["dragover","dragleave","drop"].forEach(evt=>{
      box.addEventListener(evt, e=>{
        e.preventDefault();
        box.classList.toggle("dragover", evt==="dragover");
        if (evt==="drop" && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
      });
    });
  } else {
    bind("f_link","mediaLink");
  }
  wireNav();

  function handleFile(e){ if (e.target.files[0]) readFile(e.target.files[0]); }
  function readFile(file){
    if (file.type && !file.type.startsWith("audio/")){
      alert(`This upload is for audio files only. For a video recording, please switch to "Paste a link" above instead.`);
      return;
    }
    if (file.size > CONFIG.MAX_FILE_MB*1024*1024){
      alert(`That file is larger than ${CONFIG.MAX_FILE_MB}MB. Please choose a shorter clip, or use "Paste a link instead".`);
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      d.mediaFile = file;
      d.mediaFileName = file.name;
      d.mediaFileType = file.type;
      d.mediaFileBase64 = reader.result.split(",")[1];
      document.getElementById("fname").textContent = "Selected: "+file.name;
    };
    reader.readAsDataURL(file);
  }
}

function renderReference(){
  const d = state.data, errs = state._errs || {};
  container.innerHTML = `
    <h2>Reference &amp; agreement</h2>
    <div class="sub">One person who can speak to your character — a pastor, small group leader, or mentor.</div>
    ${field("Reference name", `<input type="text" id="f_refname" value="${escAttr(d.refName)}">`, "", "refName", errs)}
    ${field("Reference phone or email", `<input type="text" id="f_refcontact" value="${escAttr(d.refContact)}">`, "", "refContact", errs)}
    <div class="field">
      <label>Team commitment</label>
      <div class="agree-row">
        <input type="checkbox" id="f_agree" ${d.agree?"checked":""}>
        <span style="font-size:13.5px;line-height:1.55;color:var(--text)">${CONFIG.AGREEMENT_TEXT}</span>
      </div>
      ${errs.agree?`<div class="error-text">${errs.agree}</div>`:""}
    </div>
    ${navButtons(true)}
  `;
  bind("f_refname","refName"); bind("f_refcontact","refContact");
  document.getElementById("f_agree").addEventListener("change", e=> d.agree = e.target.checked);
  wireNav();
}

function renderSchedule(){
  const errs = state._errs || {};
  container.innerHTML = `<h2>Request an audition day and time</h2><div class="sub">Loading available times…</div>`;
  fetchSlots().then(slots=>{
    state.slots = slots;
    const byDate = {};
    slots.forEach(s=>{ (byDate[s.date] = byDate[s.date]||[]).push(s); });
    const dates = Object.keys(byDate).sort();
    container.innerHTML = `
      <h2>Request an audition day and time</h2>
      <div class="sub">These are the only times we currently have open — choose whichever works best.</div>
      ${dates.length===0 ? `<div class="slot-empty">No audition times are open right now. Please contact ${CONFIG.CONTACT_EMAIL} to arrange a time.</div>` : ""}
      ${dates.map(date=>`
        <div class="slot-date-group">
          <h3>${formatDateLabel(date)}</h3>
          <div class="slot-list">
            ${byDate[date].map(s=>`<button type="button" class="slot-btn ${state.data.slot && state.data.slot.id===s.id?'selected':''}" data-id="${s.id}">${s.time}</button>`).join("")}
          </div>
        </div>
      `).join("")}
      ${errs.slot?`<div class="error-text">${errs.slot}</div>`:""}
      ${navButtons(true)}
    `;
    container.querySelectorAll(".slot-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const chosen = slots.find(s=>s.id===btn.dataset.id);
        state.data.slot = chosen;
        container.querySelectorAll(".slot-btn").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });
    wireNav();
  }).catch(err=>{
    container.innerHTML = `<h2>Request an audition day and time</h2><div class="error-text">Couldn't load audition times: ${err.message}</div>${navButtons(true)}`;
    wireNav();
  });
}

function renderReview(){
  const d = state.data;
  container.innerHTML = `
    <h2>Review your application</h2>
    <div class="sub">Take a look before you submit.</div>
    <div class="summary-block"><h4>Contact</h4><p>${escHtml(d.name)} — ${escHtml(d.email)} — ${escHtml(d.phone)}</p></div>
    <div class="summary-block"><h4>Role(s)</h4><p>${d.roles.map(escHtml).join(", ")}</p></div>
    <div class="summary-block"><h4>Recording</h4><p>${d.mediaMode==="file" ? "📎 "+escHtml(d.mediaFileName) : "🔗 "+escHtml(d.mediaLink)}</p></div>
    <div class="summary-block"><h4>Reference</h4><p>${escHtml(d.refName)} — ${escHtml(d.refContact)}</p></div>
    <div class="summary-block"><h4>Audition time</h4><p>${d.slot ? formatDateLabel(d.slot.date)+" at "+d.slot.time : "—"}</p></div>
    <div class="actions">
      <button class="btn btn-ghost" id="backBtn">Back</button>
      <button class="btn btn-primary" id="submitBtn" ${state.submitting?"disabled":""}>${state.submitting?'<span class="spinner"></span>Submitting…':'Submit application'}</button>
    </div>
  `;
  document.getElementById("backBtn").onclick = ()=>{ state.step--; render(); };
  document.getElementById("submitBtn").onclick = doSubmit;
}

function renderConfirmation(){
  const d = state.data;
  const r = state.bookingResult;
  container.innerHTML = `
    <div class="confirm">
      <div class="icon">🎉</div>
      <h2>You're all set, ${escHtml(d.name.split(" ")[0]||"")}!</h2>
      <p>Thanks for applying to serve with ${CONFIG.CHURCH_NAME}'s worship team. We've received your application and recording.</p>
      ${r && r.slot ? `<div class="slot-echo">Audition: ${formatDateLabel(r.slot.date)} at ${r.slot.time}</div>` : ""}
      <p style="margin-top:18px;">A confirmation will be sent to ${escHtml(d.email)}. Questions in the meantime? Reach us at ${CONFIG.CONTACT_EMAIL}.</p>
    </div>
  `;
}

/* ==========================================================
   6. HELPERS
   ========================================================== */
function checkItem(kind,val,checked){
  return `<label class="check-item ${checked?'checked':''}">
    <input type="checkbox" data-${kind}="${escAttr(val)}" ${checked?"checked":""}>
    <span>${escHtml(val)}</span>
  </label>`;
}
function bind(id,key){
  const el = document.getElementById(id);
  el.addEventListener("input", e=> state.data[key] = e.target.value);
}
function navButtons(showBack){
  return `<div class="actions">
    ${showBack ? `<button class="btn btn-ghost" id="backBtn">Back</button>` : `<span></span>`}
    <button class="btn btn-primary" id="nextBtn">Continue</button>
  </div>`;
}
function wireNav(){
  const back = document.getElementById("backBtn");
  const next = document.getElementById("nextBtn");
  if (back) back.onclick = ()=>{ state.step--; state._errs=null; render(); };
  if (next) next.onclick = ()=>{
    const errs = validateStep(state.step);
    if (Object.keys(errs).length){ state._errs = errs; render(); return; }
    state._errs = null;
    state.step++;
    render();
  };
}
function formatTextBlock(text){
  const lines = String(text||"").split("\n").map(l=>l.trim()).filter(l=>l.length);
  let html = "", inList = false;
  lines.forEach(line=>{
    if (line.startsWith("*")){
      if (!inList){ html += "<ul>"; inList = true; }
      html += `<li>${escHtml(line.slice(1).trim())}</li>`;
    } else {
      if (inList){ html += "</ul>"; inList = false; }
      const isHeading = line === line.toUpperCase() && /[A-Z]/.test(line);
      html += isHeading ? `<h4>${escHtml(line)}</h4>` : `<p>${escHtml(line)}</p>`;
    }
  });
  if (inList) html += "</ul>";
  return html;
}
function escHtml(s){ return String(s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escAttr(s){ return escHtml(s).replace(/"/g,"&quot;"); }
function formatDateLabel(iso){
  const dt = new Date(iso+"T00:00:00");
  return dt.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
}

async function doSubmit(){
  state.submitting = true; render(); state.step = 8; // stay on review while submitting
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("submitBtn").innerHTML = '<span class="spinner"></span>Submitting…';
  const d = state.data;
  const payload = {
    action: "submit_application",
    name:d.name, email:d.email, phone:d.phone, age:d.age, membershipStatus:d.membershipStatus, smallGroup:d.smallGroup,
    roles:d.roles.join(", "), experience:d.experience, instruments:d.instruments, training:d.training,
    faithAnswer:d.faithAnswer, whyJoin:d.whyJoin, previousChurch:d.previousChurch,
    availability:d.availability, conflicts:d.conflicts,
    refName:d.refName, refContact:d.refContact,
    mediaLink: d.mediaMode==="link" ? d.mediaLink : "",
    mediaFileName: d.mediaMode==="file" ? d.mediaFileName : "",
    mediaFileType: d.mediaMode==="file" ? d.mediaFileType : "",
    mediaFileBase64: d.mediaMode==="file" ? d.mediaFileBase64 : "",
    slot: d.slot
  };
  try{
    const result = await submitApplication(payload);
    state.submitting = false;
    if (result.success){
      state.bookingResult = result;
      state.submitted = true;
      render();
    } else if (result.error === "slot_taken") {
      alert("Sorry — that time was just booked by someone else. Please pick another.");
      state.data.slot = null;
      state.step = 7;
      render();
    } else {
      alert("Something went wrong submitting your application: " + (result.error || "unknown error"));
      render();
    }
  }catch(err){
    state.submitting = false;
    alert("Couldn't reach the server: " + err.message);
    render();
  }
}

render();
</script>
